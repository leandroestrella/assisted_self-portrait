      canvas.height = 32;

      const link = document.getElementById('favicon');
      let i = 0;
      setInterval(function () {
        ctx.clearRect(0, 0, 32, 32);

        link.href = canvas.toDataURL('image/png');
        i = (i + 1) % emojis.length;
      }, 800);
    })();
  </script>
